<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灵兽家族 · qmhub.cc.cd</title>
<meta name="theme-color" content="#f4f1e8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐯</text></svg>">
<!-- 本文件位于 assets/ 目录内：资源路径相对本文件，用 css/ 与 js/，不要写成 assets/ -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/poster.css">
<link rel="stylesheet" href="css/extras.css">
</head>
<body>
<div id="app">
<header class="topbar">
<div class="brand" title="返回主城"><div class="brand-mark">🐯</div><div class="brand-text"><b>灵兽家族</b><span>qmhub.cc.cd</span></div></div>
<div class="res-bar" id="resBar"></div>
<div class="player-chip" id="playerChip"></div>
</header>
<div class="body-wrap"><nav class="sidebar" id="sidebar"></nav><main class="content" id="content"></main></div>
</div>
<div id="toasts"></div><div id="modalRoot"></div>
<script src="js/data/config.js"></script>
<script src="js/data/config-ext.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/store-ext.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/api-ext.js"></script>
<script src="js/ui/kit.js"></script>
<script src="js/ui/poster-art.js"></script>
<script src="js/ui/poster.js"></script>
<script src="js/ui/battle.js"></script>
<script src="js/ui/views-a.js"></script>
<script src="js/ui/views-b.js"></script>
<script src="js/ui/app.js"></script>
<script>
(function(){
  function fail(t,d){
    document.getElementById('content').innerHTML='<div style="padding:44px 20px;max-width:660px;margin:0 auto;text-align:center;font-family:system-ui,sans-serif"><div style="font-size:52px">🐯</div><h2 style="color:#c1462f;margin:12px 0 8px;font-size:19px">'+t+'</h2><p style="color:#5d6771;font-size:13px;line-height:1.9">'+d+'</p></div>';
  }
  function boot(){
    if(!window.QMHUB||!window.QMHUB.App){
      var bad=[];
      try{performance.getEntriesByType('resource').forEach(function(e){if(/\.(js|css)(\?|$)/.test(e.name)&&e.responseStatus>=400)bad.push(e.name.replace(location.origin+'/',''));});}catch(x){}
      fail('灵兽世界加载失败', bad.length?('以下资源 404：<br><code style="color:#c1462f">'+bad.join('<br>')+'</code>'):'核心脚本未执行，QMHUB 未定义。');
      return;
    }
    try{window.QMHUB.App.boot();}catch(e){fail('灵兽世界启动异常',String((e&&e.message)||e));}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body>
</html>
