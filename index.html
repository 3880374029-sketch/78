            var i = 0;
            function tryLoad() {
                if (i >= cdnList.length) {
                    document.body.innerHTML = '<div style="color:red;text-align:center;padding:50px;">Supabase 库加载失败，请检查网络</div>';
                    return;
                }
                var s = document.createElement('script');
                s.src = cdnList[i];
                s.onload = function() {
                    console.log('✅ Supabase 库加载成功：' + cdnList[i]);
                    if (typeof initSupabase === 'function') initSupabase();
                };
                s.onerror = function() { i++; tryLoad(); };
                document.head.appendChild(s);
            }
            tryLoad();
        })();
    </script>

    function escapeHtml(t) { if (t == null) return ''; var d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; }

    // ================== XSS 安全修复 ==================
    function parseCustomMarkup(t) {
        if (!t) return '';
        var r = t.replace(/\$\\colour\s+(.*?)\$/g, function(m, c) { return '<span class="rainbow-text">' + escapeHtml(c) + '</span>'; });
        r = r.replace(/\$\\big\s+(.*?)\$/g, function(m, c) { return '<span class="big-text">' + escapeHtml(c) + '</span>'; });
        r = r.replace(/\$\\glow\s+(.*?)\$/g, function(m, c) { return '<span class="glow-text">' + escapeHtml(c) + '</span>'; });
        r = r.replace(/\$\\blink\s+(.*?)\$/g, function(m, c) { return '<span class="blink-text">' + escapeHtml(c) + '</span>'; });
        var em = { happy: '😄', happyn: '😁', why: '🤔', sad: '😢', love: '❤️', cool: '😎', angry: '😡', cry: '😭', laugh: '😂', wow: '😮' };
        r = r.replace(/\[#(.*?)\]/g, function(m, k) { return em[k.trim()] || '❓'; });
        r = r.replace(/\n/g, '<br>');
        return DOMPurify.sanitize(r);
    }

    // ================== 网络请求 ==================
    async function authFetch(url, opts) {
        var h = opts.headers || {};
        if (accessToken) h['Authorization'] = 'Bearer ' + accessToken;
        h['apikey'] = SUPABASE_ANON_KEY;
        h['Content-Type'] = 'application/json';
        var r = await fetch(url, Object.assign({}, opts, { headers: h }));
        if (r.status === 401 && refreshToken) {
            try {
                var resp = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refreshToken })
                });
                if (resp.ok) {
                    var d = await resp.json();
                    accessToken = d.access_token;
                    refreshToken = d.refresh_token;
                    localStorage.setItem('sb_token', accessToken);
                    localStorage.setItem('sb_refresh_token', refreshToken);
                    if (sb) await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                    h['Authorization'] = 'Bearer ' + accessToken;
                    return await fetch(url, Object.assign({}, opts, { headers: h }));
                } else {
                    logout();
                    showToast('登录已过期，请重新登录', true);
                    throw new Error('Session expired');
                }
            } catch (e) {
                logout();
                showToast('登录已过期，请重新登录', true);
                throw e;
            }
        }
        return r;
    }

    async function handleResponse(res) {
        var t = await res.text();
        var j = null;
        try { j = JSON.parse(t); } catch (e) {}
        if (!res.ok) {
            var m = j?.error_description || j?.message || j?.error || t || '请求失败';
            throw new Error(m);
        }
        return j || t;
    }

    async function signIn(e, p) {
        var r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: e, password: p })
        });
        if (!r.ok) { var err = await r.text(); throw new Error(err); }
        return await r.json();
    }

        var r = await fetch(SUPABASE_URL + '/auth/v1/signup', {

            body: JSON.stringify({ email: e, password: p, data: { username: u } })
        });

        return await r.json();
    }

    // ============================================================
    // Supabase 初始化
    // ============================================================
    async function initSupabase() {
        if (sbReady) return;
        if (sbInitPromise) return sbInitPromise;
        sbInitPromise = (async function() {
            if (typeof supabase === 'undefined') {
                console.error('Supabase 库未加载');
                var s = document.createElement('script');
                s.src = 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js';
                s.onload = function() { if (typeof supabase !== 'undefined') initSupabase(); };
                document.head.appendChild(s);
                return;
            }
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeToggle').textContent = savedTheme === 'light' ? '☀️' : '🌙';
            }
            var token = localStorage.getItem('sb_token');
            var refresh = localStorage.getItem('sb_refresh_token');
            if (token && refresh) {
                try {
                    await sb.auth.setSession({ access_token: token, refresh_token: refresh });
                    var { data: { user } } = await sb.auth.getUser();
                    if (user) {
                        currentUser = user;
                        accessToken = token;
                        refreshToken = refresh;
                        userProfile = await getProfile(user.id);
                        if (!userProfile) {
                            await upsertProfile({
                                id: user.id,
                                username: user.email.split('@')[0],
                                email: user.email,
                                points: 0,
                                chocolates: 0,
                                level: 1,
                                streak: 0,
                                music_prefs: { index: 0, loop: false, shuffle: false }
                            });
                            userProfile = await getProfile(user.id);
                        }
                        updateUI();
                        await loadPosts('all', '');
                        await loadTopics();
                        await loadFavorites();
                        await loadPlaylist();
                        await updateUserActivity();
                        subscribeOnlineUsers();
                        fetchOnlineUsers();
                        updateUnreadBadge();
                    }
                } catch (e) { console.warn('会话恢复失败', e); }
            }
            heartbeatInterval = setInterval(function() { if (currentUser) updateUserActivity(); }, 30000);
            setInterval(function() { if (currentUser) fetchOnlineUsers(); }, 60000);
            if (typeof Stripe !== 'undefined') stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
            renderQRPreviews();
            if (currentUser) loadPurchaseHistory();
            sbReady = true;
            console.log('✅ Supabase 初始化完成');
        })();
        return sbInitPromise;
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (typeof supabase !== 'undefined') {
            initSupabase();
        } else {
            var check = setInterval(function() {
                if (typeof supabase !== 'undefined') {
                    clearInterval(check);
                    initSupabase();
                }
            }, 500);
            setTimeout(function() {
                if (!sb) {
                    showToast('Supabase 库加载超时，请刷新页面或检查网络', true);
                }
            }, 10000);
        }
    });

    async function handleLogin(e) {
        e.preventDefault();
        if (!sb) {
            await initSupabase();
            if (!sb) {
                showToast('Supabase 客户端初始化失败，请刷新页面重试', true);
                return;
            }
        }
        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;
        try {
            var data = await signIn(email, password);
            if (data.access_token) {
                accessToken = data.access_token;
                refreshToken = data.refresh_token;
                currentUser = data.user;
                await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                localStorage.setItem('sb_token', accessToken);
                localStorage.setItem('sb_refresh_token', refreshToken);
                localStorage.setItem('sb_user', JSON.stringify(currentUser));
                userProfile = await getProfile(currentUser.id);
                if (!userProfile) {
                    await upsertProfile({
                        id: currentUser.id,
                        username: currentUser.user_metadata?.username || email.split('@')[0],
                        email: email,
                        points: 0,
                        chocolates: 0,
                        level: 1,
                        streak: 0,
                        music_prefs: { index: 0, loop: false, shuffle: false }
                    });
                    userProfile = await getProfile(currentUser.id);
                }
                showToast('✅ 登录成功', false);
                closeModal();

                await loadPosts(currentCategory, currentSearch);
                await loadTopics();
                await getTasks(currentUser.id);
                await loadFavorites();
                await loadPlaylist();
                await updateUserActivity();
                subscribeOnlineUsers();
                fetchOnlineUsers();
                updateUnreadBadge();
            } else {
                showToast('登录失败', true);
            }
        } catch (e) {
            console.error('登录错误', e);
            showToast('登录失败: ' + e.message, true);
        }
    }

    async function handleRegister(e) {
        e.preventDefault();

    // ================== 帖子功能 ==================
    async function fetchAuthors(posts) {
        if (!posts || posts.length === 0) return;
        var ids = [];
        posts.forEach(function(p) { if (p.author_id) ids.push(p.author_id); });
        ids = [...new Set(ids)];
        if (ids.length === 0) return;
        try {
            var { data, error } = await sb.from('profiles').select('id, username').in('id', ids);
            if (error) { console.warn('获取作者信息失败', error); return; }
            data.forEach(function(profile) { authorMap[profile.id] = profile.username || '用户'; });
            ids.forEach(function(id) { if (!authorMap[id]) authorMap[id] = '用户'; });
        } catch (e) { console.warn('fetchAuthors异常', e); }
    }

    async function loadUserActions(postIds) {
        if (!currentUser || !postIds || postIds.length === 0) return;
        try {
            var { data, error } = await sb.from('user_post_actions').select('post_id, action_type').eq('user_id', currentUser.id).in('post_id', postIds);
            if (error) throw error;
            userPostActions.clear();
            data.forEach(function(row) {
                if (!userPostActions.has(row.post_id)) {
                    userPostActions.set(row.post_id, { liked: false, recommended: false, downvoted: false });
                }
                var actions = userPostActions.get(row.post_id);
                if (row.action_type === 'like') actions.liked = true;
                else if (row.action_type === 'recommend') actions.recommended = true;
                else if (row.action_type === 'downvote') actions.downvoted = true;
            });
        } catch (e) { console.warn('加载用户操作记录失败', e); }
    }

    async function loadPosts(category, search) {
        try {
            var posts = await fetchPosts();
            if (category && category !== 'all') {
                posts = posts.filter(function(p) { return p.category === category; });
            }
            if (search && search.trim()) {
                var s = search.trim().toLowerCase();
                posts = posts.filter(function(p) { return p.title.toLowerCase().includes(s) || (p.content && p.content.toLowerCase().includes(s)); });
            }
            postsCache = posts;
            await fetchAuthors(posts);
            commentCountMap = await fetchCommentCounts();
            await loadFavorites();
            var postIds = posts.map(function(p) { return p.id; });
            await loadUserActions(postIds);
            renderPosts(posts);
            updateStats(posts);
            loadHotPosts(posts);
            loadTags(posts);
            renderLatex();
        } catch (e) { console.error('加载帖子失败', e); showToast('加载帖子失败: ' + e.message, true); }
    }

    function renderPosts(posts) {
        var container = document.getElementById('postList');
        if (!posts || posts.length === 0) {
            container.innerHTML = '<div class="empty-state"><h3>📭 暂无帖子</h3><p style="color:var(--text-muted);">成为第一个发帖的人吧！</p></div>';
            return;
        }
        var html = '';
        var pinned = posts.filter(function(p) { return p.pinned; });
        var normal = posts.filter(function(p) { return !p.pinned; });
        var sorted = pinned.concat(normal);
        sorted.forEach(function(post, idx) {
            var displayName = authorMap[post.author_id] || post.author_name || '匿名';
            var avatar = getAvatarUrl({ username: displayName, avatar_url: post.author_avatar });
            var commentCount = commentCountMap[post.id] || 0;
            var excerpt = post.content ? post.content.replace(/<[^>]+>/g, '').substring(0, 120) : '';
            var catMap = { tech: '技术', life: '生活', career: '职业', topic: '话题' };
            var catName = catMap[post.category] || post.category || '综合';
            var isPinned = post.pinned ? '<span class="pin-icon">📌</span>' : '';
            var tags = post.tags ? post.tags.split(',').filter(function(t) { return t.trim(); }) : [];
            var tagsHtml = '';
            tags.forEach(function(tag) {
                var safeTag = escapeJsString(tag.trim());
                tagsHtml += '<span class="tag-item" onclick="searchByTag(\'' + safeTag + '\')">#' + escapeHtml(tag.trim()) + '</span>';
            });
            var safePostId = escapeJsString(post.id);
            var isFav = favoriteMap.get(post.id) ? '❤️' : '🤍';
            var actions = userPostActions.get(post.id) || { liked: false, recommended: false, downvoted: false };
            var likeClass = actions.liked ? 'active' : '';
            var recommendClass = actions.recommended ? 'active' : '';
            var downvoteClass = actions.downvoted ? 'active' : '';
            var syncStatus = post._syncing ? ' syncing' : '';
            var syncText = post._syncing ? '<span class="sync-status">⏳ 同步中</span>' : '';
            html += '<div class="post-card' + syncStatus + '" data-id="' + escapeHtml(post.id) + '">' +
                '<div class="post-title" onclick="showPost(\'' + safePostId + '\')">' + isPinned + escapeHtml(post.title) + ' ' + syncText + '</div>' +
                '<div class="post-meta">' +
                '<img class="author-avatar" src="' + escapeHtml(avatar) + '" alt="avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=U&background=7c6aff&color=fff&size=100&length=2\'">' +
                '<span class="author">' + escapeHtml(displayName) + '</span>' +
                '<span class="level-badge">' + escapeHtml(getLevelInfo(post.author_level || 1).name) + '</span>' +
                '<span>' + escapeHtml(formatTime(post.created_at)) + '</span>' +
                '<span class="badge ' + escapeHtml(post.category || 'tech') + '">' + escapeHtml(catName) + '</span>' +
                tagsHtml +
                '</div>' +
                '<div class="post-excerpt">' + escapeHtml(excerpt) + (excerpt.length >= 120 ? '...' : '') + '</div>' +
                '<div class="post-footer">' +
                '<span>💬 ' + commentCount + '</span>' +
                '<span class="like-btn ' + likeClass + '" onclick="handleLike(\'' + safePostId + '\')">❤️ ' + (post.likes || 0) + '</span>' +
                '<span class="recommend-btn ' + recommendClass + '" onclick="handleRecommend(\'' + safePostId + '\')">👍 ' + (post.recommends || 0) + '</span>' +
                '<span class="downvote-btn ' + downvoteClass + '" onclick="handleDownvote(\'' + safePostId + '\')">👎 ' + (post.downvotes || 0) + '</span>' +
                '<span>👁️ ' + (post.views || 0) + '</span>' +
                '<span>🍫 ' + (post.chocolate_count || 0) + '</span>' +
                '<span class="fav-btn" onclick="toggleFavorite(\'' + safePostId + '\')">' + isFav + '</span>' +
                '<span style="margin-left:auto;color:var(--text-muted);font-size:.7rem;">#' + (idx + 1) + '</span>' +
                '</div></div>';
        });
        if (currentView === 'grid') {
            container.innerHTML = '<div class="posts-grid">' + html + '</div>';
        } else {
            container.innerHTML = html;
        }
    }

    function updateStats(posts) {

    function loadHotPosts(posts) {
        var container = document.getElementById('hotItems');
        if (!posts || posts.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);">暂无热门</p>';
            return;
        }
        var sorted = posts.slice().sort(function(a, b) {
            return ((b.likes || 0) + (b.recommends || 0) * 2) - ((a.likes || 0) + (a.recommends || 0) * 2);
        });
        var top = sorted.slice(0, 5);
        var html = '';
        top.forEach(function(p, i) {
            var safeId = escapeJsString(p.id);
            html += '<div class="hot-item"><a href="#" onclick="showPost(\'' + safeId + '\')"><span><span class="hot-num">' + (i + 1) + '</span>' + escapeHtml(p.title) + '</span><span style="color:var(--text-muted);">🔥 ' + ((p.likes || 0) + (p.recommends || 0) * 2) + '</span></a></div>';
        });
        container.innerHTML = html;
    }

    function loadTags(posts) {
        var container = document.getElementById('tagList');
        if (!posts || posts.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);">暂无标签</p>';
            return;
        }
        var tagMap = {};
        posts.forEach(function(p) {
            if (p.tags) {
                p.tags.split(',').forEach(function(t) {
                    var key = t.trim();
                    if (key) tagMap[key] = (tagMap[key] || 0) + 1;
                });
            }
        });
        var sorted = Object.entries(tagMap).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 15);
        if (sorted.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);">暂无标签</p>';
            return;
        }
        var html = '';
        sorted.forEach(function(item) {
            var tag = item[0],
                count = item[1];
            var safeTag = escapeJsString(tag);
            html += '<span class="tag-item" onclick="searchByTag(\'' + safeTag + '\')">#' + escapeHtml(tag) + ' (' + count + ')</span>';
        });
        container.innerHTML = html;
    }

    async function showPost(postId) {
        try {
            var resp = await authFetch(SUPABASE_URL + '/rest/v1/posts?id=eq.' + encodeURIComponent(postId) + '&select=views', { method: 'GET' });
            var data = await handleResponse(resp);
            if (!data || data.length === 0) { showToast('帖子不存在', true); return; }
            var currentViews = data[0].views || 0;
            await authFetch(SUPABASE_URL + '/rest/v1/posts?id=eq.' + encodeURIComponent(postId), {
                method: 'PATCH',
                body: JSON.stringify({ views: currentViews + 1 })
            });
            var posts = await fetchPosts();
            var post = posts.find(function(p) { return p.id == postId; });
            if (!post) { showToast('帖子不存在', true); return; }
            currentPostId = postId;
            document.getElementById('postList').style.display = 'none';
            document.getElementById('postDetail').style.display = 'block';
            var comments = await fetchComments(postId);
            if (!authorMap[post.author_id]) { await fetchAuthors([post]); }
            await loadCommentLikes(comments);
            await loadUserActions([postId]);
            renderPostDetail(post, comments);
            await updateUserActivity();
            renderLatex();
        } catch (e) { console.error('加载帖子详情失败', e); showToast('加载失败', true); }
    }

    function renderPostDetail(post, comments) {

        var catName = catMap[post.category] || post.category || '综合';
        var tags = post.tags ? post.tags.split(',').filter(function(t) { return t.trim(); }) : [];
        var tagsHtml = '';
        tags.forEach(function(tag) {
            var safeTag = escapeJsString(tag.trim());
            tagsHtml += '<span class="tag-item" onclick="searchByTag(\'' + safeTag + '\')">#' + escapeHtml(tag.trim()) + '</span>';
        });
        var levelName = getLevelInfo(post.author_level || 1).name;
        var safePostId = escapeJsString(post.id);
        var safeAuthorId = escapeJsString(post.author_id);

    function backToList() {
        document.getElementById('postDetail').style.display = 'none';
        document.getElementById('postList').style.display = 'block';
        currentPostId = null;
        loadPosts(currentCategory, currentSearch);
    }

    async function publishPost() {
        if (!currentUser) { showToast('请先登录', true); return; }
        var title = document.getElementById('publishTitle').value.trim();
        var content = document.getElementById('publishContent').value.trim();
        var category = document.getElementById('publishCategory').value;
        var tags = document.getElementById('publishTags').value.trim();
        if (!title) { showToast('请输入标题', true); return; }
        if (!content) { showToast('请输入内容', true); return; }
        if (publishLock) { showToast('请勿频繁发布', true); return; }
        var now = Date.now();
        if (now - lastPublishTime < 2000) { showToast('请稍后再发布', true); return; }
        publishLock = true;
        lastPublishTime = now;
        var tempId = genTempId();
        var newPost = {
            id: tempId,
            title: title,
            content: content,
            category: category,
            author_id: currentUser.id,
            author_name: userProfile?.username || '匿名',
            author_avatar: userProfile?.avatar_url || null,
            author_level: userProfile?.level || 1,
            tags: tags || null,
            created_at: new Date().toISOString(),
            likes: 0,
            recommends: 0,
            downvotes: 0,
            views: 0,
            chocolate_count: 0,
            pinned: false,
            _optimistic: true,
            _syncing: true
        };
        postsCache.unshift(newPost);
        var currentFiltered = postsCache.filter(function(p) {
            if (currentCategory !== 'all' && p.category !== currentCategory) return false;
            if (currentSearch.trim()) {
                var s = currentSearch.trim().toLowerCase();
                if (!p.title.toLowerCase().includes(s) && !(p.content && p.content.toLowerCase().includes(s))) return false;
            }
            return true;
        });
        renderPosts(currentFiltered);
        updateStats(postsCache);
        document.getElementById('publishForm').style.display = 'none';
        document.getElementById('publishTitle').value = '';
        document.getElementById('publishContent').value = '';
        document.getElementById('publishTags').value = '';
        showToast('📤 发布中...', false);
        await processMentions(content, currentUser.id, tempId, 'post');
        try {
            var data = {
                title: title,
                content: content,
                category: category,
                author_id: currentUser.id,
                author_name: userProfile?.username || '匿名',
                author_avatar: userProfile?.avatar_url || null,
                author_level: userProfile?.level || 1,
                tags: tags || null,
                created_at: new Date().toISOString()
            };
            var result = await createPost(data);
            var realPost = result && result.length > 0 ? result[0] : null;
            if (realPost) {
                var idx = postsCache.findIndex(function(p) { return p.id === tempId; });
                if (idx !== -1) {
                    postsCache[idx] = Object.assign(realPost, {
                        _optimistic: false,
                        _syncing: false,
                        author_name: userProfile?.username || '匿名',
                        author_avatar: userProfile?.avatar_url || null,
                        author_level: userProfile?.level || 1
                    });
                } else {
                    await loadPosts(currentCategory, currentSearch);
                }
            } else {
                await loadPosts(currentCategory, currentSearch);
            }
            await updateTaskProgress(currentUser.id, 'daily_post', 1);
            showToast('✅ 发布成功', false);
            updateStats(postsCache);
            var finalFiltered = postsCache.filter(function(p) {
                if (currentCategory !== 'all' && p.category !== currentCategory) return false;
                if (currentSearch.trim()) {
                    var s = currentSearch.trim().toLowerCase();
                    if (!p.title.toLowerCase().includes(s) && !(p.content && p.content.toLowerCase().includes(s))) return false;
                }
                return true;
            });
            renderPosts(finalFiltered);
            renderLatex();
        } catch (e) {
            console.error('发布失败', e);
            showToast('❌ 发布失败，请重试', true);
            var idx = postsCache.findIndex(function(p) { return p.id === tempId; });
            if (idx !== -1) postsCache.splice(idx, 1);
            var rollbackFiltered = postsCache.filter(function(p) {
                if (currentCategory !== 'all' && p.category !== currentCategory) return false;
                if (currentSearch.trim()) {
                    var s = currentSearch.trim().toLowerCase();
                    if (!p.title.toLowerCase().includes(s) && !(p.content && p.content.toLowerCase().includes(s))) return false;
                }
                return true;
            });
            renderPosts(rollbackFiltered);
            updateStats(postsCache);
            document.getElementById('publishForm').style.display = 'block';
        } finally {
            publishLock = false;
            await updateUserActivity();
        }
    }

    async function publishComment(postId) {
        if (!currentUser) { showToast('请先登录', true); return; }
        var content = document.getElementById('commentInput').value.trim();
        if (!content) { showToast('请输入评论内容', true); return; }
        var tempId = genTempId();
        var newComment = {
            id: tempId,
            post_id: postId,
            author_id: currentUser.id,
            author_name: userProfile?.username || '匿名',
            author_avatar: userProfile?.avatar_url || null,
            content: content,
            created_at: new Date().toISOString(),
            likes: 0,
            _optimistic: true,
            _syncing: true
        };
        await processMentions(content, currentUser.id, postId, 'comment');
        var commentList = document.getElementById('commentList');
        if (commentList) {
            var avatar = getAvatarUrl({ username: newComment.author_name, avatar_url: newComment.author_avatar });
            var commentHtml = '<div class="reply-item" data-id="' + tempId + '">' +
                '<div class="reply-author-info">' +
                '<img src="' + escapeHtml(avatar) + '" alt="avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=U&background=7c6aff&color=fff&size=100&length=2\'">' +
                '<span class="reply-author">' + escapeHtml(newComment.author_name) + '</span>' +
                '<span class="reply-time">' + formatTime(newComment.created_at) + '</span>' +
                '<span class="sync-status">⏳ 发布中...</span>' +
                '</div><div class="reply-content">' + nl2br(newComment.content) + '</div>' +
                '<div class="reply-actions"><span class="comment-like-btn">🤍 0</span></div></div>';
            commentList.innerHTML = commentHtml + commentList.innerHTML;
            document.getElementById('commentInput').value = '';
            var commentCountEl = document.querySelector('#postDetail h3');
            if (commentCountEl) {
                var match = commentCountEl.textContent.match(/\d+/);
                var count = match ? parseInt(match[0]) : 0;
                commentCountEl.textContent = '💬 评论 (' + (count + 1) + ')';
            }
            showToast('📤 评论发送中...', false);
        } else {
            showToast('评论区域未找到，请刷新', true);
            return;
        }
        try {
            var data = {
                post_id: postId,
                author_id: currentUser.id,
                author_name: userProfile?.username || '匿名',
                author_avatar: userProfile?.avatar_url || null,
                content: content,
                created_at: new Date().toISOString()
            };
            await createComment(data);
            await showPost(postId);
            await updateTaskProgress(currentUser.id, 'daily_comment', 1);
            showToast('✅ 评论成功', false);
            renderLatex();
        } catch (e) {
            console.error('评论失败', e);
            showToast('❌ 评论失败，请重试', true);
            var tempEl = commentList.querySelector('[data-id="' + tempId + '"]');
            if (tempEl) tempEl.remove();
            var commentCountEl = document.querySelector('#postDetail h3');
            if (commentCountEl) {
                var match = commentCountEl.textContent.match(/\d+/);
                var count = match ? parseInt(match[0]) : 0;
                commentCountEl.textContent = '💬 评论 (' + Math.max(0, count - 1) + ')';
            }
        } finally {
            await updateUserActivity();
        }
    }

    // ================== 修复后的 performAction（强制刷新） ==================
    async function performAction(postId, actionType, taskType) {
        if (!currentUser) { showToast('请先登录', true); return; }
        var lockKey = postId + '_' + actionType;
        if (actionLocks.has(lockKey)) { showToast('操作进行中，请稍候...', false); return; }
        actionLocks.add(lockKey);
        try {
            var resp = await authFetch(SUPABASE_URL + '/rest/v1/posts?id=eq.' + encodeURIComponent(postId) + '&select=likes,recommends,downvotes', { method: 'GET' });
            var data = await handleResponse(resp);
            if (!data || data.length === 0) throw new Error('帖子不存在');
            var post = data[0];
            var newLikes = post.likes || 0,
                newRecommends = post.recommends || 0,
                newDownvotes = post.downvotes || 0;
            var { data: actions, error } = await sb.from('user_post_actions')
                .select('action_type')
                .eq('user_id', currentUser.id)
                .eq('post_id', postId);
            if (error) throw error;
            var actionTypes = actions.map(a => a.action_type);
            var hasAction = actionTypes.includes(actionType);
            var hasLike = actionTypes.includes('like');
            var hasRecommend = actionTypes.includes('recommend');
            var hasDownvote = actionTypes.includes('downvote');
            if (hasAction) {
                if (actionType === 'like') newLikes -= 1;
                else if (actionType === 'recommend') newRecommends -= 1;
                else if (actionType === 'downvote') newDownvotes -= 1;
                await sb.from('user_post_actions').delete()
                    .eq('user_id', currentUser.id)
                    .eq('post_id', postId)
                    .eq('action_type', actionType);
            } else {
                if (actionType === 'like') {
                    if (hasRecommend) { newRecommends -= 1; await sb.from('user_post_actions').delete().eq('user_id', currentUser.id).eq('post_id', postId).eq('action_type', 'recommend'); }
                    if (hasDownvote) { newDownvotes -= 1; await sb.from('user_post_actions').delete().eq('user_id', currentUser.id).eq('post_id', postId).eq('action_type', 'downvote'); }
                    newLikes += 1;
                } else if (actionType === 'recommend') {
                    if (hasLike) { newLikes -= 1; await sb.from('user_post_actions').delete().eq('user_id', currentUser.id).eq('post_id', postId).eq('action_type', 'like'); }
                    if (hasDownvote) { newDownvotes -= 1; await sb.from('user_post_actions').delete().eq('user_id', currentUser.id).eq('post_id', postId).eq('action_type', 'downvote'); }
                    newRecommends += 1;
                } else if (actionType === 'downvote') {
                    if (hasLike) { newLikes -= 1; await sb.from('user_post_actions').delete().eq('user_id', currentUser.id).eq('post_id', postId).eq('action_type', 'like'); }
                    if (hasRecommend) { newRecommends -= 1; await sb.from('user_post_actions').delete().eq('user_id', currentUser.id).eq('post_id', postId).eq('action_type', 'recommend'); }
                    newDownvotes += 1;
                }
                await sb.from('user_post_actions').insert({
                    user_id: currentUser.id,
                    post_id: postId,
                    action_type: actionType
                }, { onConflict: 'user_id, post_id, action_type' });
                if (taskType) { await updateTaskProgress(currentUser.id, taskType, 1); }
            }
            await authFetch(SUPABASE_URL + '/rest/v1/posts?id=eq.' + encodeURIComponent(postId), {
                method: 'PATCH',
                body: JSON.stringify({ likes: newLikes, recommends: newRecommends, downvotes: newDownvotes })
            });
            // 强制刷新视图
            if (currentPostId === postId) {
                await showPost(postId);
            } else {
                await loadPosts(currentCategory, currentSearch);
            }
            await updateUserActivity();
            showToast('操作成功', false);
        } catch (e) {
            console.error(actionType + '操作失败', e);
            showToast('操作失败: ' + e.message, true);
        } finally {
            actionLocks.delete(lockKey);
        }
    }

    async function handleLike(postId) { await performAction(postId, 'like', 'daily_like'); }
    async function handleRecommend(postId) { await performAction(postId, 'recommend', 'daily_recommend'); }
    async function handleDownvote(postId) { await performAction(postId, 'downvote', null); }
